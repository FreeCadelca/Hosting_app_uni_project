<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .hidden { display: none !important; }
        nav { margin-bottom: 1rem; }
        nav ul { list-style: none; display: flex; gap: 1rem; padding: 0; }
        nav a { cursor: pointer; text-decoration: underline; }
        .plan-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .plan-card { border: 1px solid var(--pico-muted-border-color); border-radius: 8px; padding: 1.5rem; text-align: center; }
        .plan-card h3 { margin-bottom: 0.5rem; }
        .plan-card .price { font-size: 1.5rem; font-weight: bold; color: var(--pico-primary); }
        .plan-card .specs { margin: 1rem 0; font-size: 0.9rem; }
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
        .status-active { background: #d4edda; color: #155724; }
        .status-pending, .status-provisioning { background: #fff3cd; color: #856404; }
        .status-stopped { background: #f8d7da; color: #721c24; }
        .status-restarting { background: #cce5ff; color: #004085; }
        table { width: 100%; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-group button { font-size: 0.8rem; padding: 4px 10px; }
        .notification { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .notification.success { background: #d4edda; color: #155724; }
        .notification.error { background: #f8d7da; color: #721c24; }
        .notification.info { background: #cce5ff; color: #004085; }
        #order-section { max-width: 500px; }
    </style>
</head>
<body>
    <main class="container">
        <h1>🖥️ Hosting Service</h1>

        <!-- Auth section (shown when not logged in) -->
        <section id="auth-section">
            <div id="notification-auth"></div>
            <article>
                <h2 id="auth-title">Sign In</h2>
                <form id="auth-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <div class="btn-group">
                        <button type="submit" id="btn-login">Sign In</button>
                        <button type="button" id="btn-register" class="secondary">Register</button>
                    </div>
                </form>
            </article>
        </section>

        <!-- App section (shown when logged in) -->
        <section id="app-section" class="hidden">
            <nav>
                <ul>
                    <li><a onclick="showPage('plans')">📦 Plans</a></li>
                    <li><a onclick="showPage('servers')">🖥️ My Servers</a></li>
                    <li><a onclick="logout()">🚪 Logout</a></li>
                </ul>
                <small id="user-info"></small>
            </nav>

            <div id="notification-app"></div>

            <!-- Plans page -->
            <div id="page-plans">
                <h2>Available Plans</h2>
                <div id="plans-container" class="plan-cards"></div>
            </div>

            <!-- Order page -->
            <div id="page-order" class="hidden">
                <h2>Order Confirmation</h2>
                <article id="order-section">
                    <div id="order-details"></div>
                    <button id="btn-pay" onclick="payOrder()">💳 Pay Now</button>
                </article>
            </div>

            <!-- Servers page -->
            <div id="page-servers" class="hidden">
                <h2>My Servers</h2>
                <button onclick="loadServers()" class="secondary" style="margin-bottom:1rem;">🔄 Refresh</button>
                <div id="servers-container"></div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = '';
        let token = localStorage.getItem('jwt_token');
        let currentOrderId = null;
        let currentServerId = null;
        let pollInterval = null;

        // ==================== AUTH ====================
        function authHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        function notify(containerId, msg, type = 'info') {
            const el = document.getElementById(containerId);
            el.innerHTML = `<div class="notification ${type}">${msg}</div>`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await doLogin();
        });

        document.getElementById('btn-register').addEventListener('click', async () => {
            await doRegister();
        });

        async function doLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');
                token = data.access_token;
                localStorage.setItem('jwt_token', token);
                enterApp();
            } catch (err) {
                notify('notification-auth', err.message, 'error');
            }
        }

        async function doRegister() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Registration failed');
                token = data.access_token;
                localStorage.setItem('jwt_token', token);
                notify('notification-auth', 'Registration successful!', 'success');
                enterApp();
            } catch (err) {
                notify('notification-auth', err.message, 'error');
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('jwt_token');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        }

        async function enterApp() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            // Load user info
            try {
                const res = await fetch(`${API_BASE}/api/auth/me`, { headers: authHeaders() });
                const user = await res.json();
                if (res.ok) {
                    document.getElementById('user-info').textContent = `Logged in as: ${user.email}`;
                }
            } catch (e) {}
            showPage('plans');
        }

        // ==================== PAGES ====================
        function showPage(page) {
            document.getElementById('page-plans').classList.add('hidden');
            document.getElementById('page-order').classList.add('hidden');
            document.getElementById('page-servers').classList.add('hidden');
            document.getElementById(`page-${page}`).classList.remove('hidden');
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }

            if (page === 'plans') loadPlans();
            if (page === 'servers') loadServers();
        }

        // ==================== PLANS ====================
        async function loadPlans() {
            try {
                const res = await fetch(`${API_BASE}/api/products/plans`);
                const plans = await res.json();
                const container = document.getElementById('plans-container');
                container.innerHTML = plans.map(p => `
                    <article class="plan-card">
                        <h3>${p.name}</h3>
                        <div class="specs">
                            <div>🔲 ${p.cpu} vCPU</div>
                            <div>🧠 ${p.ram_mb} MB RAM</div>
                            <div>💾 ${p.disk_gb} GB Disk</div>
                        </div>
                        <div class="price">$${p.price_monthly}/mo</div>
                        <br>
                        <button onclick="orderPlan(${p.id}, '${p.name}', ${p.price_monthly})">Order</button>
                    </article>
                `).join('');
            } catch (err) {
                notify('notification-app', 'Failed to load plans', 'error');
            }
        }

        // ==================== ORDER ====================
        async function orderPlan(planId, planName, price) {
            try {
                const res = await fetch(`${API_BASE}/api/products/order`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ plan_id: planId })
                });
                const order = await res.json();
                if (!res.ok) throw new Error(order.detail || 'Order failed');

                currentOrderId = order.id;
                currentServerId = order.server_id;

                document.getElementById('order-details').innerHTML = `
                    <p><strong>Plan:</strong> ${planName}</p>
                    <p><strong>Amount:</strong> $${price}</p>
                    <p><strong>Order ID:</strong> ${order.id}</p>
                    <p><strong>Server ID:</strong> ${order.server_id}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-pending">Pending Payment</span></p>
                `;

                document.getElementById('btn-pay').classList.remove('hidden');
                showPage('order');
            } catch (err) {
                notify('notification-app', err.message, 'error');
            }
        }

        async function payOrder() {
            try {
                const res = await fetch(`${API_BASE}/api/payment/pay`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ order_id: currentOrderId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Payment failed');

                document.getElementById('btn-pay').classList.add('hidden');
                document.getElementById('order-details').innerHTML += `
                    <p>✅ Payment successful! Server is being provisioned...</p>
                    <p><span class="status-badge status-provisioning">Provisioning...</span></p>
                `;

                // Poll for server status
                pollInterval = setInterval(async () => {
                    const srvRes = await fetch(`${API_BASE}/api/servers/`, { headers: authHeaders() });
                    const servers = await srvRes.json();
                    const server = servers.find(s => s.id === currentServerId);
                    if (server && server.status === 'active') {
                        clearInterval(pollInterval);
                        pollInterval = null;
                        document.getElementById('order-details').innerHTML += `
                            <p>🎉 Server is ready!</p>
                            <p><strong>Hostname:</strong> ${server.hostname}</p>
                            <p><strong>IP:</strong> ${server.ip_address}</p>
                            <p><span class="status-badge status-active">Active</span></p>
                        `;
                        notify('notification-app', 'Server provisioned successfully!', 'success');
                    }
                }, 2000);

            } catch (err) {
                notify('notification-app', err.message, 'error');
            }
        }

        // ==================== SERVERS ====================
        async function loadServers() {
            try {
                const res = await fetch(`${API_BASE}/api/servers/`, { headers: authHeaders() });
                const servers = await res.json();
                const container = document.getElementById('servers-container');

                if (servers.length === 0) {
                    container.innerHTML = '<p>No servers yet. Go to Plans to order one!</p>';
                    return;
                }

                container.innerHTML = `
                    <table role="grid">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Hostname</th>
                                <th>IP Address</th>
                                <th>OS</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${servers.map(s => `
                                <tr>
                                    <td>${s.id}</td>
                                    <td>${s.hostname || '—'}</td>
                                    <td>${s.ip_address || '—'}</td>
                                    <td>${s.os}</td>
                                    <td><span class="status-badge status-${s.status}">${s.status}</span></td>
                                    <td>
                                        <div class="btn-group">
                                            <button onclick="serverAction(${s.id}, 'reboot')" ${s.status !== 'active' ? 'disabled' : ''}>🔄 Reboot</button>
                                            <button onclick="serverAction(${s.id}, 'stop')" ${s.status !== 'active' ? 'disabled' : ''}>⏹️ Stop</button>
                                            <button onclick="serverAction(${s.id}, 'start')" ${s.status !== 'stopped' ? 'disabled' : ''}>▶️ Start</button>
                                            <button onclick="serverAction(${s.id}, 'reset-password')" class="secondary">🔑 Reset PW</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                notify('notification-app', 'Failed to load servers', 'error');
            }
        }

        async function serverAction(serverId, action) {
            try {
                const res = await fetch(`${API_BASE}/api/servers/${serverId}/${action}`, {
                    method: 'POST',
                    headers: authHeaders()
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Action failed');
                notify('notification-app', data.message, 'success');
                // Reload after a brief delay (for reboot to finish)
                setTimeout(() => loadServers(), action === 'reboot' ? 3000 : 500);
            } catch (err) {
                notify('notification-app', err.message, 'error');
            }
        }

        // ==================== INIT ====================
        if (token) {
            enterApp();
        }
    </script>
</body>
</html>
